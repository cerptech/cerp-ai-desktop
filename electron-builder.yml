appId: com.cerp.ai-desktop
productName: CERP AI
copyright: Copyright (c) 2026 CERP Tech

directories:
  output: dist
  buildResources: resources

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.env,.env.*,.gitignore}'
  - '!{tsconfig.json,tsconfig.*.json}'
  - '!build/**' # recursos del empaquetado (entitlements, NSIS, hook de firma): no van dentro de la app

# Claude Agent SDK 0.3.x spawns a NATIVE per-platform binary (claude.exe / claude),
# shipped in the separate package @anthropic-ai/claude-agent-sdk-<platform>-<arch>.
# Both the SDK and the platform binary packages must be unpacked from the asar so the
# native binary exists on disk and can be executed as a child process.
asarUnpack:
  - 'node_modules/@anthropic-ai/claude-agent-sdk/**'
  - 'node_modules/@anthropic-ai/claude-agent-sdk-*/**'

# Auto-updater via GitHub Releases
publish:
  provider: github
  owner: cerptech
  repo: cerp-ai-desktop
  releaseType: release

# ============================================================
# Windows — NSIS Installer
# ============================================================
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: 'CERP-AI-Desktop-${version}-Setup.${ext}'
  # Firma con SSL.com eSigner (build/sign-esigner.js). Sin credenciales no firma,
  # así que los builds locales y los de PRs siguen funcionando igual.
  # Solo se firman .exe: CERP AI.exe, elevate.exe, el desinstalador y Setup.exe
  # (4 firmas por release). El claude.exe del Agent SDK ya viene firmado por
  # Anthropic y el hook lo deja como está.
  signtoolOptions:
    sign: ./build/sign-esigner.js
    signingHashAlgorithms: ['sha256'] # sha1 duplicaría las firmas sin aportar nada
    # publisherName: ['CERP Tech, SL']
    # ↑ Activarlo en el MISMO release que el primer instalador firmado, con el CN
    # exacto del certificado. electron-updater verifica cada update contra este
    # nombre: si no coincide carácter por carácter, los clientes dejan de actualizar.
    # Al renovar el certificado, AGREGAR el nombre nuevo a la lista, nunca reemplazarlo.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CERP AI
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  include: build/installer.nsh
  license: build/license.txt

# ============================================================
# macOS — DMG + Universal Binary
# ============================================================
mac:
  icon: resources/icon.png
  category: public.app-category.business
  artifactName: 'CERP-AI-Desktop-${version}-${arch}.${ext}'
  target:
    - target: dmg
      arch: [x64, arm64]
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ============================================================
# Linux — AppImage + deb
# ============================================================
linux:
  icon: resources/icon.png
  category: Office
  artifactName: 'CERP-AI-Desktop-${version}.${ext}'
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  desktop:
    entry: # electron-builder 26: las claves del .desktop van bajo `entry`
      Name: CERP AI
      Comment: Asistente IA para cotizaciones y licitaciones de obra
      Categories: Office;ProjectManagement;

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
