name: Build & Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

  workflow_dispatch: # Allow manual trigger
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false

permissions:
  contents: write # Needed to create releases

jobs:
  build:
    strategy:
      # Un fallo de red en una plataforma no debe cancelar las demás
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # npm ci corre el install.js de electron, que descarga el zip desde los
      # releases de GitHub y sufre los mismos cortes intermitentes (socket hang up)
      # que el paso del instalador — mismo remedio: reintentos con backoff.
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npm ci && exit 0
            echo "npm ci falló (intento $i/5) — reintento en 90s"
            sleep 90
          done
          exit 1

      - name: Build app
        run: npm run build

      # La descarga del zip de Electron desde los releases de GitHub falla de forma
      # intermitente (EOF) en los runners — visto el 2026-08-12, 4 intentos seguidos.
      # Reintentar el paso completo con backoff resuelve el caso sin cambiar de CDN.
      - name: Build installer (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --win --config && exit 0
            echo "electron-builder falló (intento $i/5) — reintento en 90s"
            sleep 90
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --mac --config && exit 0
            echo "electron-builder falló (intento $i/5) — reintento en 90s"
            sleep 90
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --linux --config && exit 0
            echo "electron-builder falló (intento $i/5) — reintento en 90s"
            sleep 90
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cerp-ai-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
