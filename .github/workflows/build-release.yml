name: Build & Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

  workflow_dispatch: # Allow manual trigger
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false

permissions:
  contents: write # Needed to create releases

jobs:
  build:
    strategy:
      # Un fallo de red en una plataforma no debe cancelar las demás
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    env:
      # Firma de Windows (SSL.com eSigner): solo en builds de tag y solo cuando los
      # secrets existen. Mientras no estén cargados, el release sigue saliendo sin firmar.
      WIN_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ES_CREDENTIAL_ID != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # npm ci corre el install.js de electron, que descarga el zip desde los
      # releases de GitHub y sufre los mismos cortes intermitentes (socket hang up)
      # que el paso del instalador — mismo remedio: reintentos con backoff.
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npm ci && exit 0
            echo "npm ci falló (intento $i/5) — reintento en 90s"
            sleep 90
          done
          exit 1

      - name: Build app
        run: npm run build

      # La descarga del zip de Electron desde los releases de GitHub falla de forma
      # intermitente (EOF) en los runners — visto el 2026-08-12, 4 intentos seguidos.
      # Reintentar el paso completo con backoff resuelve el caso sin cambiar de CDN.
      # CodeSignTool de SSL.com, versión fija y verificada por checksum.
      - name: Install CodeSignTool (Windows)
        if: matrix.platform == 'win' && env.WIN_SIGNING == 'true'
        shell: bash
        run: |
          curl -sSL --retry 5 -o "$RUNNER_TEMP/cst.zip" \
            https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip
          echo "4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b  $RUNNER_TEMP/cst.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cst.zip" -d "$RUNNER_TEMP/CodeSignTool"
          echo "CODESIGNTOOL_DIR=$(cygpath -w "$RUNNER_TEMP/CodeSignTool")" >> "$GITHUB_ENV"

      # Con firma, cada reintento vuelve a consumir firmas del plan de eSigner:
      # 3 intentos en vez de 5.
      - name: Build installer (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          for i in 1 2 3; do
            npx electron-builder --win --config && exit 0
            echo "electron-builder falló (intento $i/3) — reintento en 90s"
            sleep 90
          done
          exit 1
        env:
          # El certificado vive en eSigner, no en el runner: que electron-builder no
          # busque uno local. La firma la hace build/sign-esigner.js.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ES_USERNAME: ${{ env.WIN_SIGNING == 'true' && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ env.WIN_SIGNING == 'true' && secrets.ES_PASSWORD || '' }}
          ES_CREDENTIAL_ID: ${{ env.WIN_SIGNING == 'true' && secrets.ES_CREDENTIAL_ID || '' }}
          ES_TOTP_SECRET: ${{ env.WIN_SIGNING == 'true' && secrets.ES_TOTP_SECRET || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate: si la firma está activa, no se publica un .exe sin firma válida.
      # electron-builder solo avisa (warning) cuando falla la firma de un archivo
      # de la app, así que esta verificación es la que frena el release.
      - name: Verify signature (Windows)
        if: matrix.platform == 'win' && env.WIN_SIGNING == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/*-Setup.exe) + @(Get-Item "dist/win-unpacked/CERP AI.exe")
          $failed = $false
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            $subject = $sig.SignerCertificate.Subject
            Write-Host "$($f.Name): $($sig.Status) | $subject | timestamp: $($null -ne $sig.TimeStamperCertificate)"
            if ($sig.Status -ne 'Valid' -or $subject -notmatch 'CERP' -or $null -eq $sig.TimeStamperCertificate) {
              Write-Host "::error file=$($f.Name)::firma inválida, de otro editor o sin timestamp"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Build installer (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --mac --config && exit 0
            echo "electron-builder falló (intento $i/5) — reintento en 90s"
            sleep 90
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --linux --config && exit 0
            echo "electron-builder falló (intento $i/5) — reintento en 90s"
            sleep 90
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cerp-ai-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
